summary = "deciding that two paths name the same directory"
sites = [
  "crates/config/src/lib.rs::same_root",
  "crates/config/src/profile_ref.rs::same_dir",
  "crates/cli/src/cmd/cli_client/helpers.rs::same_root",
  "crates/runtime/src/doctor.rs::same_path",
]
reason = "transitional"
agreement = "unverified"
exit = "every caller uses config's same_root"

[[parallel]]
id = "toc-from-headings"
summary = "building a table of contents from heading blocks"
sites = [
  "crates/extract/src/txt.rs::toc_from_headings",
  "crates/extract/src/html.rs::toc_from_headings",
]
reason = "transitional"
agreement = "unverified"
exit = "one shared module in extract holds it"
