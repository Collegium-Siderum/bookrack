# Known exceptions to the workspace's structure rules, read by
# scripts/structure-check.sh. The rules themselves are in that script.
#
# Every entry carries a `reason` from a closed set:
#   dependency-direction  sharing would need an edge the tier table forbids
#   stamp-isolation       the copies feed different version stamps
#   compile-boundary      the build structure keeps the code apart
#   wire-pin              a test restates a wire value on purpose
#   external-constraint   a third-party API wants one copy per site
#   transitional          the move is planned; `exit` names what ends it
#
# An entry the code no longer needs fails the check: delete it in the
# commit that makes it stale.
#
# The format is a rigid subset of TOML: one `key = "value"` per line,
# and one array element per line.

# Dependency edges the tier table forbids.

