# Bookrack-tracked cargo configuration.
#
# `config.local.toml` is gitignored and holds machine-specific overrides
# (e.g. an external `target-dir`); contributors create it as needed. The
# include is marked optional, so a checkout without the file (CI, a
# fresh clone) loads this tracked configuration alone. The tracked file
# only carries cross-workspace settings.

include = [{ path = "config.local.toml", optional = true }]
