[package]
name = "bookrack-embed"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# `Problem` / `Explain`: the three-part diagnostic `EmbedError`
# renders itself into for the operator-facing front ends.
bookrack-core = { path = "../core" }
reqwest.workspace = true
serde.workspace = true
# Parses Ollama's `{"error": "..."}` failure envelope, which is what
# separates a 404 from the daemon (model absent) from a 404 served by
# whatever else `BOOKRACK_OLLAMA_URL` happens to point at.
serde_json.workspace = true
thiserror.workspace = true
# `time` for the inter-retry backoff sleep.
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
# A hand-rolled one-shot mock HTTP server backs the client tests, so no
# real Ollama is needed; it wants raw sockets and async IO.
tokio = { workspace = true, features = ["net", "io-util", "rt", "macros"] }
