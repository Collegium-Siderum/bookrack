[package]
name = "bookrack-ops"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bookrack-audit-profile.workspace = true
bookrack-catalog = { path = "../catalog" }
bookrack-config = { path = "../config" }
bookrack-control-client = { path = "../control-client" }
bookrack-core = { path = "../core", features = ["schema"] }
bookrack-corpus = { path = "../corpus" }
bookrack-dbkit = { path = "../dbkit" }
bookrack-diagnose = { path = "../diagnose" }
bookrack-distill = { path = "../distill" }
bookrack-embed = { path = "../embed" }
bookrack-extract = { path = "../extract" }
bookrack-metadata = { path = "../metadata" }
bookrack-obs = { path = "../obs", features = ["schema"] }
bookrack-query = { path = "../query", features = ["schema"] }
bookrack-refs = { path = "../refs", features = ["schema"] }
bookrack-rerank = { path = "../rerank" }
bookrack-search = { path = "../search", features = ["schema"] }
bookrack-session = { path = "../session" }
bookrack-text = { path = "../text" }
bookrack-vectors = { path = "../vectors", features = ["schema"] }
chrono.workspace = true
eyre.workspace = true
