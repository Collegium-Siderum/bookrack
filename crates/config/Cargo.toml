[package]
name = "bookrack-config"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The knob-origin vocabulary every resolver in this crate reports
# through. The only workspace edge `config` carries: it stays below
# everything that reads configuration.
bookrack-core = { path = "../core" }
chrono.workspace = true
dirs.workspace = true
dotenvy.workspace = true
fs2.workspace = true
serde.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
toml_edit.workspace = true
uuid.workspace = true

[dev-dependencies]
# Host isolation for the two integration binaries that drive the
# impure `Config::resolve`. A dev-dependency cycle back onto this
# crate, which cargo permits: the test-support crate depends on the
# library, and only this crate's *tests* depend on it.
bookrack-test-support.workspace = true
serde_json.workspace = true
