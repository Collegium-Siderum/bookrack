[package]
name = "bookrack-vectors"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bookrack-core = { path = "../core" }
bookrack-dbkit = { path = "../dbkit" }
lancedb.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
futures.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
# JSON Schema derives behind the `schema` feature.
schemars = { workspace = true, optional = true }

[dev-dependencies]
# A tokio runtime to drive the async tests; tempfile is in [dependencies]
# because vectors_meta.json uses NamedTempFile for atomic rename.
tokio.workspace = true

[features]
# Derive `schemars::JsonSchema` on the types this crate hands the
# method table. Off by default; `bookrack-ops` turns it on.
schema = ["dep:schemars"]
