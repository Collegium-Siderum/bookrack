[package]
name = "bookrack-query"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bookrack-catalog = { path = "../catalog" }
bookrack-core = { path = "../core" }
bookrack-corpus = { path = "../corpus" }
bookrack-embed = { path = "../embed" }
bookrack-text = { path = "../text" }
bookrack-search = { path = "../search" }
bookrack-vectors = { path = "../vectors" }
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
# JSON Schema derives behind the `schema` feature.
schemars = { workspace = true, optional = true }

[dev-dependencies]
bookrack-extract = { path = "../extract" }
bookrack-config = { path = "../config" }
bookrack-ops = { path = "../ops" }
tempfile.workspace = true

[features]
# Derive `schemars::JsonSchema` on the types this crate hands the
# method table. Off by default; `bookrack-ops` turns it on.
schema = ["dep:schemars"]
