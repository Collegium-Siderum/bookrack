[package]
name = "bookrack-obs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bookrack-config = { path = "../config" }
bookrack-core = { path = "../core" }
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
# Timestamping log events captured by `BroadcastLayer`. `serde` lets
# `DateTime<Utc>` round-trip through the SSE wire format alongside the
# `LogEvent` body.
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
# Broadcast channel + ring buffer that fan out log events to live
# subscribers (`session.logs_tail`, the SSE endpoint, REPL `:logs tail`).
tokio = { workspace = true, features = ["sync"] }
# JSON Schema derives behind the `schema` feature.
schemars = { workspace = true, optional = true }

[features]
# Derive `schemars::JsonSchema` on the types this crate hands the
# method table. Off by default; `bookrack-ops` turns it on.
schema = ["dep:schemars"]
