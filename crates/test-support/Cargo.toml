[package]
name = "bookrack-test-support"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bookrack-core = { path = "../core" }
bookrack-config = { path = "../config" }
bookrack-session = { path = "../session" }
serde_json.workspace = true
tempfile.workspace = true
# `process`/`io-util` drive a child and drain its streams; `time` the
# readiness polls and deadlines; `rt` the drainer tasks; `sync` the
# bounded queue and report between a drainer and its sink's writer.
tokio = { workspace = true, features = ["io-util", "process", "rt", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
# Process groups, `waitid`, and signals for reclaiming a child's tree.
rustix.workspace = true
