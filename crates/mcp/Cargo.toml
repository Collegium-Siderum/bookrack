[package]
name = "bookrack-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bookrack-config = { path = "../config" }
bookrack-core = { path = "../core" }
bookrack-obs = { path = "../obs" }
bookrack-ops = { path = "../ops" }
bookrack-runtime = { path = "../runtime" }
rmcp.workspace = true
axum.workspace = true
# `BroadcastStream` adapter to fan the LogStreamHandle broadcast
# receiver into an axum SSE response for the /session/logs endpoint.
# Re-exports the `Stream` trait so no separate `futures` dep is needed
# at the listener layer.
tokio-stream.workspace = true
tokio.workspace = true
eyre.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
# The client side of the protocol, for the tests that drive the server
# through a real client session.
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
# Query-layer error values the mapping tests build by hand.
bookrack-query = { path = "../query" }
# The embedding client type the fixture registries are built over, and
# the embed error values the mapping tests build by hand.
bookrack-embed = { path = "../embed" }
# Timestamps on the queue jobs the queue-status tests seed.
chrono.workspace = true
# Reference-store fixtures and error values the reference tool tests
# build by hand.
bookrack-refs.workspace = true
# Catalog fixtures and error values the mapping tests build by hand.
bookrack-catalog = { path = "../catalog" }
# Reranker error values the mapping tests build by hand.
bookrack-rerank = { path = "../rerank" }
# Search-layer error values the mapping tests build by hand.
bookrack-search = { path = "../search" }
# The cached extraction envelope a re-audit test grades a book from.
bookrack-extract = { path = "../extract" }
# Stamp a `user_version` the build does not read onto a fixture
# reference store, so the schema-mismatch mapping is exercised end to
# end.
bookrack-dbkit = { path = "../dbkit" }
# Tempdir-backed catalog fixtures for the handler-level tool-call
# tests, which drive `serve` through a real streamable-HTTP client.
tempfile.workspace = true
# Redirects the test binary's environment into a sandbox, so the
# status card's registry read never reaches the machine's own.
bookrack-test-support.workspace = true
