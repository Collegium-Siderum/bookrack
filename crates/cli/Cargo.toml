[package]
name = "bookrack-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "bookrack"
path = "src/main.rs"

[dependencies]
bookrack-config = { path = "../config" }
bookrack-audit-profile.workspace = true
bookrack-control-client = { path = "../control-client" }
bookrack-core = { path = "../core" }
bookrack-diagnose = { path = "../diagnose" }
bookrack-mcp = { path = "../mcp" }
bookrack-obs = { path = "../obs" }
bookrack-ops = { path = "../ops" }
bookrack-catalog = { path = "../catalog" }
bookrack-cli-grammar = { path = "../cli-grammar" }
bookrack-runtime = { path = "../runtime" }
bookrack-session = { path = "../session" }
# v2 distill rollout (phase 10): the local `bookrack distill` family
# (build / verify / list) opens `Refs` directly, reads book.toml,
# and runs the pipeline without going through the daemon's control
# plane.
bookrack-refs.workspace = true
bookrack-distill.workspace = true
chrono.workspace = true
clap.workspace = true
tokio.workspace = true
eyre.workspace = true
color-eyre.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
comfy-table.workspace = true
indicatif.workspace = true
anstyle.workspace = true

[dev-dependencies]
bookrack-dbkit = { path = "../dbkit" }
bookrack-extract = { path = "../extract" }
# Lay down a corpus store in a fixture library, so a verify report can
# be about a whole library rather than one with a store missing.
bookrack-corpus = { path = "../corpus" }
bookrack-test-support.workspace = true
tempfile.workspace = true
