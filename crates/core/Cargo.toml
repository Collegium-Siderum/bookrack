[package]
name = "bookrack-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
# Timestamp fields on the persistent ingest queue (`queued_at`,
# `started_at`, `finished_at`). Round-tripped through serde as RFC 3339
# strings.
chrono.workspace = true
# JSON Schema derives behind the `schema` feature.
schemars = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[features]
# Derive `schemars::JsonSchema` on the types this crate hands the
# method table. Off by default; `bookrack-ops` turns it on.
schema = ["dep:schemars"]
