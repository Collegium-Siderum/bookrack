name: ci
on: [push, pull_request]

# The token can only read the repository; no job writes back to it.
permissions:
  contents: read

# A second push to the same branch cancels the still-running CI for the
# previous push. Saves runner minutes on rapid-fire pushes; the final
# push always gets a clean, current result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation in CI thrashes the cache (every commit
  # produces a new incremental dir) without speeding anything up,
  # because the cache key is the Cargo.lock hash, not the source.
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      # Caches ~/.cargo/{registry,git} and target/. Key derives from
      # Cargo.lock + rustc version + shared-key suffix. clippy and test
      # use different cargo profiles, so they get separate caches to
      # avoid invalidation churn.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
      - name: Install protoc
        # protoc: build dependency of lancedb (lance-encoding).
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Free runner disk space
        # The workspace debug build (lancedb + datafusion) plus
        # the restored target/ cache outgrows the ~14 GB free on a
        # hosted runner; when the disk fills, the linker dies with
        # SIGBUS mid-link. Dropping preinstalled toolchains the build
        # never touches frees roughly 15 GB up front.
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Check where the managed directory is
        # The cache path below is the per-user data directory only while
        # the runner leaves XDG_DATA_HOME unset.
        run: test -z "${XDG_DATA_HOME:-}"
      - name: Cache PDFium managed directory
        # The directory `bookrack setup pdfium` installs into, which is
        # where the PDF tests find the library. The cache key is tied to
        # the pinned chromium build, so a hit always carries the right
        # ABI for the pdfium_NNNN cargo feature in extract/Cargo.toml.
        # Bump the key when PDFIUM_VERSION.md bumps; otherwise stale
        # binaries persist.
        id: pdfium-cache
        uses: actions/cache@v5
        with:
          path: ~/.local/share/bookrack/pdfium
          key: pdfium-chromium-8125-linux-x64-slot
      - name: Install pinned PDFium
        # The PDF adapter binds PDFium at runtime, so its tests need the
        # native library. Pinned to one build — see
        # crates/extract/PDFIUM_VERSION.md. The sha256 check makes a
        # corrupt download or a silently re-cut upstream asset fail
        # loudly here, and `setup pdfium --from` verifies the archive
        # again before it installs. The runner sets `CI`, so a library
        # the tests cannot find fails them instead of skipping them.
        if: steps.pdfium-cache.outputs.cache-hit != 'true'
        run: |
          curl -L -o pdfium.tgz \
            https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F8125/pdfium-linux-x64.tgz
          echo "e1c3ce6e270cb5e0c20816b379ad9f2c1309972697c505f508de92bf5e7d6659  pdfium.tgz" | sha256sum -c -
          cargo run -p bookrack-cli --bin bookrack -- setup pdfium --from pdfium.tgz
          rm pdfium.tgz
      - name: Install cargo-nextest
        # Prebuilt binary, pinned. nextest runs every test in its own
        # process, which some tests rely on for sound environment
        # mutation; plain `cargo test` shares one process per binary
        # and lets `std::env::set_var` leak across threads.
        run: |
          curl -LsSf https://get.nexte.st/0.9.140/linux | \
            tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      - run: cargo nextest run --workspace

  test-clean:
    runs-on: ubuntu-latest
    # Required, like every other job here. It ran once tolerated, to see
    # what a first contact with an unknown host-coupling channel would
    # turn up; it reported exactly what the `test` job did, so there was
    # nothing to tolerate. A difference appearing from here on is a
    # channel to close, not a reason to soften the gate again.
    steps:
      - uses: actions/checkout@v6
      - name: Free runner disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          # Its own cache: this job and `test` build the same profile
          # but run under different environments, and sharing the key
          # would make each invalidate the other's incremental state.
          shared-key: test-clean
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Check where the managed directory is
        run: test -z "${XDG_DATA_HOME:-}"
      - name: Cache PDFium managed directory
        # The same key as the `test` job, so the two share one download.
        id: pdfium-cache
        uses: actions/cache@v5
        with:
          path: ~/.local/share/bookrack/pdfium
          key: pdfium-chromium-8125-linux-x64-slot
      - name: Install pinned PDFium
        # Installed into the runner's own home; the script mirrors it
        # into the scrubbed one and forwards `CI`, so the PDF tests stay
        # mandatory here too.
        if: steps.pdfium-cache.outputs.cache-hit != 'true'
        run: |
          curl -L -o pdfium.tgz \
            https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F8125/pdfium-linux-x64.tgz
          echo "e1c3ce6e270cb5e0c20816b379ad9f2c1309972697c505f508de92bf5e7d6659  pdfium.tgz" | sha256sum -c -
          cargo run -p bookrack-cli --bin bookrack -- setup pdfium --from pdfium.tgz
          rm pdfium.tgz
      - name: Install cargo-nextest
        run: |
          curl -LsSf https://get.nexte.st/0.9.140/linux | \
            tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      - run: ./scripts/test-clean.sh

  leak-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: ./scripts/leak-check.sh
      - run: ./scripts/error-boundary-check.sh
      - run: ./scripts/dep-stamp-check.sh
      # `cargo metadata` is the one thing here that needs a toolchain;
      # nothing is compiled.
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: ./scripts/structure-check.sh
