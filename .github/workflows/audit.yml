name: audit
# Checks Cargo.lock against the RustSec advisory database. A new
# advisory lands without any change to this repository, so the check
# also runs on a daily schedule; a push or pull request runs it only
# when the lockfile or the configuration changes. Exceptions, each with
# its reason, live in deny.toml.
on:
  push:
    paths:
      - Cargo.lock
      - deny.toml
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - Cargo.lock
      - deny.toml
      - .github/workflows/audit.yml
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

# The token can only read the repository; no job writes back to it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # cargo-deny reads the dependency graph through `cargo metadata`,
      # so the pinned toolchain has to be present.
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install cargo-deny
        # Prebuilt binary, pinned. The sha256 check makes a corrupt
        # download or a re-cut upstream asset fail here.
        run: |
          curl -L -o cargo-deny.tgz \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  cargo-deny.tgz" | sha256sum -c -
          tar -xzf cargo-deny.tgz --strip-components=1 -C "${CARGO_HOME:-$HOME/.cargo}/bin" \
            cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny
      - run: cargo deny --locked check advisories
